name: Build and publish macOS test release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: release-1.3.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone tools
        run: python3 scripts/prepare-runtime.py
      - name: Build Safari extension and main app
        run: |
          bash scripts/build-safari.sh
          SAFARI_EXTENSION_PATH="$PWD/build/safari-extension/疾风下载Safari助手 Extension.appex" OUTPUT_DIR="$PWD/dist" bash build.sh
          codesign --verify --deep --strict dist/疾风下载.app
      - name: Verify helpers
        run: |
          node Tests/extension-tests.mjs
          node Tests/video-tests.mjs
          node Tests/popup-tests.mjs
          for tool in dist/疾风下载.app/Contents/Resources/Tools/*; do
            if otool -L "$tool" | grep -q /opt/homebrew; then exit 1; fi
          done
          dist/疾风下载.app/Contents/Resources/Tools/ffmpeg -version
          dist/疾风下载.app/Contents/Resources/Tools/deno --version
          dist/疾风下载.app/Contents/Resources/Tools/yt-dlp --version
      - name: Package app and corresponding sources
        run: |
          mkdir -p stage third-party-sources
          ditto dist/疾风下载.app stage/疾风下载.app
          ln -s /Applications stage/Applications
          cp README.md stage/使用说明.md
          hdiutil create -volname '疾风下载 1.3.0 测试版' -srcfolder stage -format UDZO dist/JifengDownload-1.3.0-AppleSilicon.dmg
          hdiutil verify dist/JifengDownload-1.3.0-AppleSilicon.dmg
          cp .cache/ffmpeg-8.0.1.tar.xz scripts/build-ffmpeg.sh third-party-sources/
          cp -R ThirdParty third-party-sources/Notices
          curl -fL --retry 3 https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.tar.gz -o third-party-sources/yt-dlp-2026.08.19-source.tar.gz
          curl -fL --retry 3 https://github.com/denoland/deno/releases/download/v2.9.7/deno_src.tar.gz -o third-party-sources/deno-2.9.7-source.tar.gz
          tar -czf dist/JifengDownload-1.3.0-ThirdPartySources.tar.gz -C third-party-sources .
          cd dist
          shasum -a 256 JifengDownload-1.3.0-AppleSilicon.dmg JifengDownload-1.3.0-ThirdPartySources.tar.gz > JifengDownload-1.3.0-SHA256.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.3.0-beta.1 dist/JifengDownload-1.3.0-AppleSilicon.dmg dist/JifengDownload-1.3.0-ThirdPartySources.tar.gz dist/JifengDownload-1.3.0-SHA256.txt --clobber

# Preserve Safari entitlements when embedding the extension.
